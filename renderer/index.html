<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>OVC</title>
    <link rel="stylesheet" href="./styles.css" />
  </head>
  <body>
    <main class="app-shell">
      <aside class="sidebar">
        <div>
          <h1>OVC</h1>
          <p class="subtitle">Office version control</p>
        </div>

        <section class="panel">
          <label>Workspace</label>
          <div class="path-box" id="workspacePath">No workspace selected</div>
          <button id="selectWorkspaceBtn">Choose Folder</button>
          <button id="initBtn" class="secondary">Init Repository</button>
        </section>

        <section class="panel">
          <label>Files</label>
          <button id="selectFilesBtn">Add Office Files</button>
          <button id="statusBtn" class="secondary">Refresh Status</button>
        </section>
      </aside>

      <section class="content">
        <header class="toolbar">
          <div>
            <h2>Working Tree</h2>
            <p id="messageLine">Choose a workspace to begin.</p>
          </div>
          <button id="logBtn" class="secondary">Show Log</button>
        </header>

        <section class="grid">
          <article class="card">
            <h3>Status</h3>
            <pre id="statusOutput">No status yet.</pre>
          </article>

          <article class="card">
            <h3>Commit</h3>
            <textarea id="commitMessage" rows="4" placeholder="Commit message"></textarea>
            <button id="commitBtn">Commit Staged Files</button>
          </article>
        </section>

        <section class="card">
          <div class="section-header">
            <h3>History</h3>
            <div class="inline-controls">
              <input id="filterFileInput" placeholder="Optional file path for log/diff" />
              <button id="diffBtn" class="secondary">Diff Latest</button>
            </div>
          </div>
          <div id="historyList" class="history-list">No history loaded.</div>
        </section>

        <section class="card">
          <h3>Diff</h3>
          <pre id="diffOutput">No diff loaded.</pre>
        </section>
      </section>
    </main>

    <script src="./app.js"></script>
  </body>
</html>
