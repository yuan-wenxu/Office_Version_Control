[package]
name = "ovc"
version = "2.0.0"
description = "Office file version control desktop app"
authors = ["OVC"]
edition = "2021"

[[bin]]
name = "ovc"
path = "src/main.rs"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
flate2 = "1"
hex = "0.4"
quick-xml = "0.38"
rfd = "0.15"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
similar = "2"
tauri = { version = "2", features = ["tray-icon"] }
time = { version = "0.3", features = ["formatting"] }
tiny_http = { version = "0.12", features = ["ssl-rustls"] }
walkdir = "2"
zip = { version = "2", default-features = false, features = ["deflate"] }
